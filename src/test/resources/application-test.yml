spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

scraper:
  timeout-ms: 3000
  stores:
    kontakt:
      enabled: true
      base-url: "https://kontakt.az"
    irshad:
      enabled: true
      base-url: "https://irshad.az"
    soliton:
      enabled: true
      base-url: "https://soliton.az"
